<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="t">
  <title id="t">Strategic Digital Transformation — slide preview</title>
  <defs>
    <linearGradient id="dtL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#121212"/>
      <stop offset="100%" style="stop-color:#1f1410"/>
    </linearGradient>
    <linearGradient id="dtR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c43b2b"/>
      <stop offset="100%" style="stop-color:#5c1a12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dtL)"/>
  <rect x="400" y="0" width="400" height="450" fill="url(#dtR)"/>
  <text x="40" y="95" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Strategic Digital</text>
  <text x="40" y="130" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Transformation</text>
  <text x="40" y="178" fill="#d4af37" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.12em">GROWTH STRATEGY</text>
  <!-- ladder metaphor -->
  <g transform="translate(520, 140)">
    <rect x="118" y="0" width="14" height="220" fill="#2a2a2a" rx="2"/>
    <rect x="0" y="200" width="250" height="10" fill="#3d3d3d" rx="2"/>
    <rect x="20" y="165" width="90" height="12" fill="#d4af37" fill-opacity="0.85" rx="2"/>
    <rect x="20" y="125" width="90" height="12" fill="#d4af37" fill-opacity="0.65" rx="2"/>
    <rect x="20" y="85" width="90" height="12" fill="#d4af37" fill-opacity="0.45" rx="2"/>
    <rect x="168" y="28" width="120" height="48" fill="#d4af37" fill-opacity="0.2" stroke="#d4af37" stroke-width="2" rx="4"/>
    <text x="228" y="58" text-anchor="middle" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SUCCESS</text>
  </g>
</svg>
